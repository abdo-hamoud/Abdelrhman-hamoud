<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة البورتفوليو</title>
<style>
:root{color-scheme:dark;--bg:#0d1020;--panel:#171c30;--line:#323950;--text:#f5f3ff;--muted:#b6b8cb;--accent:#a8baff;--pink:#ff88c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}a{color:var(--accent)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 5%;border-bottom:1px solid var(--line)}h1,h2,p{margin:0 0 10px}h1{font-size:24px}h2{font-size:19px}small,.muted{color:var(--muted)}main{max-width:1350px;margin:auto;padding:28px 20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}#login{max-width:580px;margin:30px auto}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:1px solid var(--line);background:#252b43;color:var(--text);border-radius:9px;padding:9px 14px}button.primary{background:var(--accent);color:#131b33;border:none;font-weight:700}button.danger{color:#ffabb8}button:hover{filter:brightness(1.15)}button:disabled{opacity:.5;cursor:not-allowed}input:not([type=checkbox]),textarea,select{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#101425;color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{min-height:95px;resize:vertical}label{display:block;margin:10px 0 5px;font-weight:600}#workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}#nav{position:sticky;top:15px;align-self:start;display:grid;gap:7px}#nav button{text-align:right}#nav button.active{border-color:var(--accent);background:#333d66}.record{display:grid;gap:9px;padding:14px;border:1px solid var(--line);border-radius:13px;margin:12px 0}.record summary{cursor:pointer;font-weight:700;overflow-wrap:anywhere}.record .actions{margin-top:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 15px}.fields .wide{grid-column:1/-1}#status{white-space:pre-wrap;min-height:28px;padding:8px 0;color:var(--accent)}#status.err{color:#ffabb8}#editor{min-width:0}.thumb{width:110px;height:90px;object-fit:contain;background:#0d1020;border-radius:9px;margin-top:8px}#previewDialog{width:min(96vw,1200px);height:90vh;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}iframe{width:100%;height:calc(100% - 52px);border:0;background:white} [hidden]{display:none!important} @media(max-width:700px){#workspace{grid-template-columns:1fr}#nav{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>لوحة إدارة البورتفوليو</h1><small>عبدالرحمن حمود · تحرير ونشر مباشر</small></div><div class="actions"><a href="../" target="_blank" rel="noopener noreferrer">عرض الموقع</a><button id="logout" hidden>تسجيل خروج</button></div></header>
<main><div id="status" role="status" aria-live="polite"></div>
<section id="login" class="panel"><h2>دخول الإدارة</h2><p class="muted">سجّل الدخول بحساب الإدارة الخاص بك.</p><form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com" dir="ltr"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required dir="ltr"><div class="actions" style="margin-top:14px"><button class="primary" id="signIn" type="submit">تسجيل الدخول</button></div></form></section>
<section id="work" hidden><div class="panel" style="margin-bottom:18px"><div class="actions"><button id="publish" class="primary">نشر التعديلات على الموقع</button><button id="preview">معاينة</button><button id="reload">إعادة تحميل البيانات</button><button id="backup">تنزيل نسخة احتياطية</button><span class="muted" id="dirty"></span></div></div><div id="workspace"><nav id="nav" class="panel" aria-label="الأقسام"></nav><section id="editor" class="panel"></section></div></section></main>
<dialog id="previewDialog"><div class="actions" style="margin-bottom:10px"><button id="closePreview">إغلاق المعاينة</button></div><iframe id="frame" sandbox="allow-scripts allow-popups" title="معاينة الموقع"></iframe></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), repo='abdo-hamoud/Abdelrhman-hamoud', api='https://api.github.com', branch='main', publicBase='https://abdo-hamoud.github.io/Abdelrhman-hamoud/';
const tabs=[
['PUBLIC_POSTS','البوستات والكابشنات','list'],['PUBLIC_BRANDS','البراندات','list'],['PUBLIC_PF_SERVICES','الخدمات','list'],['PUBLIC_PF_ABOUT','من أنا','object'],['PUBLIC_PF_SERVICE_INTRO','مقدمة الخدمات','object'],['PUBLIC_VIDEOS','الفيديوهات','list'],['PUBLIC_TESTIMONIALS','آراء العملاء','list'],['PUBLIC_SITE_LINKS','روابط التواصل','object'],['PUBLIC_THEME','الألوان والمظهر','object'],['PUBLIC_PF_LAYOUT','ترتيب الأقسام وإخفاؤها','list'],['PUBLIC_PF_LIVE_TEXT','النصوص الثابتة','json'],['PUBLIC_HEADING_EDITS','العناوين','json'],['PUBLIC_CASES','دراسات الحالة','json'],['PUBLIC_COPYWRITING','نماذج الكتابة','json'],['PUBLIC_EXTRA_PROJECT_LINKS','روابط المشروعات','json'],['PUBLIC_LOCALIZED_TITLES','العناوين المترجمة','json']];
const fieldLabels={id:'المعرّف',client:'اسم البراند بالإنجليزي',clientAr:'اسم البراند بالعربي',sector:'القطاع',sectorAr:'القطاع بالعربي',market:'السوق',marketAr:'السوق بالعربي',type:'النوع',typeAr:'النوع بالعربي',title:'العنوان',titleAr:'العنوان بالعربي',titleEn:'العنوان بالإنجليزي',copy:'الكابشن',img:'الصورة',logo:'اللوجو',hidden:'إخفاء',descAr:'الوصف بالعربي',descEn:'الوصف بالإنجليزي',bodyAr:'النص بالعربي',bodyEn:'النص بالإنجليزي',subtitleAr:'العنوان الفرعي بالعربي',subtitleEn:'العنوان الفرعي بالإنجليزي',introAr:'المقدمة بالعربي',introEn:'المقدمة بالإنجليزي',primary:'اللون الأساسي',secondary:'اللون الثانوي',dark:'اللون الداكن',light:'اللون الفاتح',radius:'استدارة الحواف',motion:'الحركة',name:'الاسم',role:'الوظيفة',quote:'الرأي',url:'الرابط',published:'منشور'};
let authConfig=null, token='',source='',sha='',data={},active=tabs[0][0],changed=false,busy=false,pending=new Map(),previewURL='';
const status=(msg,err=false)=>{$('status').textContent=msg;$('status').classList.toggle('err',err)};
const elt=(tag,txt,cls)=>{const el=document.createElement(tag);if(txt!=null)el.textContent=txt;if(cls)el.className=cls;return el};
const btn=(txt,fn,cls)=>{const b=elt('button',txt,cls);b.type='button';b.addEventListener('click',fn);return b};
function mark(){changed=true;$('dirty').textContent='تعديلات غير منشورة';}
function clean(){changed=false;$('dirty').textContent='النسخة مطابقة لآخر تحميل';}
function setBusy(v){busy=v;for(const id of ['publish','reload','logout','signIn','preview','backup'])$(id).disabled=v;$('editor').inert=v;$('nav').inert=v;}
async function configuration(){if(authConfig)return authConfig;const r=await fetch('./auth-config.json',{cache:'no-store'});if(!r.ok)throw Error('تسجيل الدخول بالإيميل غير مفعّل بعد. يلزم ربط Supabase أولاً.');const c=await r.json();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(c.url)||!c.publishableKey)throw Error('إعدادات تسجيل الدخول غير مكتملة');authConfig=c;return c}
async function call(path,options={}){const c=await configuration();const response=await fetch(c.url+'/functions/v1/portfolio-admin',{method:'POST',headers:{apikey:c.publishableKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({path,method:options.method||'GET',body:options.body?JSON.parse(options.body):null})});let payload;try{payload=await response.json()}catch{payload={}}if(!response.ok)throw Error('تعذر تنفيذ الطلب: '+(payload.message||response.status));return payload}
function decode64(s){return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)))}
function encode64(s){const b=new TextEncoder().encode(s);let out='';for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(out)}
function assignment(s,key){const m=new RegExp('window\\.'+key+'\\s*=\\s*').exec(s);if(!m)throw Error('البيانات غير موجودة: '+key);const start=m.index+m[0].length;let q=false,esc=false,depth=0;for(let i=start;i<s.length;i++){const c=s[i];if(q){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')q=false;continue}if(c==='"')q=true;else if(c==='{'||c==='[')depth++;else if(c==='}'||c===']'){if(--depth===0){const end=i+1;return {start,end,value:JSON.parse(s.slice(start,end))}}}}throw Error('بيانات غير صالحة: '+key)}
function parse(s){return Object.fromEntries(tabs.map(([key])=>[key,assignment(s,key).value]))}
function safeJSON(v){return JSON.stringify(v).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')}
function build(){let output=source;for(const [key] of tabs){const a=assignment(output,key);output=output.slice(0,a.start)+safeJSON(data[key])+output.slice(a.end)}return output}
async function load(){const f=await call('/repos/'+repo+'/contents/index.html?ref='+branch);if(!f.content||f.encoding!=='base64')throw Error('تعذر قراءة ملف الموقع');const next=decode64(f.content),parsed=parse(next);source=next;sha=f.sha;data=parsed;pending.clear();clean();render()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;setBusy(true);try{status('جارٍ التحقق من الحساب…');const c=await configuration();const email=$('email').value.trim(),password=$('password').value;const response=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({email,password})});$('password').value='';const result=await response.json();if(!response.ok||!result.access_token)throw Error('البريد الإلكتروني أو كلمة المرور غير صحيحة، أو الحساب غير مفعّل.');token=result.access_token;await load();$('login').hidden=true;$('work').hidden=false;$('logout').hidden=false;status('تم تسجيل الدخول بنجاح. يمكنك تعديل المحتوى الآن.')}catch(e){token='';status(e.message,true)}finally{$('password').value='';setBusy(false)}});
async function logout(){if(changed&&!confirm('تسجيل الخروج دون نشر التعديلات؟'))return;const previous=token;token='';if(previous&&authConfig){try{await fetch(authConfig.url+'/auth/v1/logout',{method:'POST',headers:{apikey:authConfig.publishableKey,Authorization:'Bearer '+previous}})}catch{}}source='';sha='';data={};pending.clear();clean();$('editor').replaceChildren();$('work').hidden=true;$('logout').hidden=true;$('login').hidden=false;closePreview();status('تم تسجيل الخروج.')}
$('logout').onclick=logout;
function makeField(obj,key,container,onChange){const value=obj[key],field=elt('div',null,['copy','bodyAr','bodyEn','descAr','descEn','quote','img','logo'].includes(key)||typeof value==='object'?'wide':'');const label=elt('label',fieldLabels[key]||key);field.append(label);let input;
if(typeof value==='boolean'){input=document.createElement('input');input.type='checkbox';input.checked=value;input.onchange=()=>{obj[key]=input.checked;onChange()}}
else if(typeof value==='number'){input=document.createElement('input');input.type='number';input.value=value;input.oninput=()=>{if(input.value!==''){obj[key]=Number(input.value);onChange()}}}
else if(value!==null&&typeof value==='object'){input=document.createElement('textarea');input.value=JSON.stringify(value,null,2);input.dir='ltr';input.onchange=()=>{try{obj[key]=JSON.parse(input.value);input.setCustomValidity('');onChange()}catch{input.setCustomValidity('JSON غير صالح');input.reportValidity();input.value=JSON.stringify(obj[key],null,2);status('لم يتم حفظ الحقل: JSON غير صالح',true)}}}
else{input=document.createElement(['copy','bodyAr','bodyEn','descAr','descEn','quote','introAr','introEn'].includes(key)?'textarea':'input');input.value=value??'';input.oninput=()=>{obj[key]=input.value;onChange()};if(['url','img','logo','email','phone','whatsapp'].includes(key))input.dir='ltr';}
label.append(input);container.append(field);
if(['img','logo','image','thumbnail'].includes(key)){const pic=elt('img',null,'thumb');const refresh=()=>{const v=String(obj[key]||'');pic.hidden=!v;if(!v){pic.removeAttribute('src');return}try{const resolved=new URL(v,publicBase);if(resolved.protocol==='https:'||v.startsWith('data:image/'))pic.src=resolved.href;else pic.hidden=true}catch{pic.hidden=true}};refresh();input.addEventListener('change',refresh);field.append(pic);const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp,image/gif';file.onchange=async()=>{try{const f=file.files[0];if(!f)return;if(f.size>8*1024*1024)throw Error('اختر صورة أصغر من 8 ميجابايت');if(!['image/jpeg','image/png','image/webp','image/gif'].includes(f.type))throw Error('صيغة صورة غير مدعومة');const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'}[f.type];const name='assets/admin-'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;const uri=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)});pending.set(name,uri.split(',')[1]);obj[key]=key==='thumbnail'?publicBase+name:name;input.value=obj[key];pic.src=uri;pic.hidden=false;mark()}catch(e){status(e.message,true)}};field.append(file)}
}
function defaultRecord(key){const id='cms_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);if(key==='PUBLIC_POSTS')return {id,client:'',clientAr:'',sector:'healthcare',sectorAr:'القطاع الطبي',market:'Egypt',marketAr:'مصر',type:'',typeAr:'',title:'',titleEn:'',img:'',copy:''};if(key==='PUBLIC_BRANDS')return {client:'',clientAr:'',sector:'healthcare',market:'Egypt',marketAr:'مصر',logo:'',hidden:false};if(key==='PUBLIC_PF_SERVICES')return{id,titleAr:'',titleEn:'',descAr:'',descEn:''};if(key==='PUBLIC_VIDEOS')return{id,titleAr:'',titleEn:'',url:'',thumbnail:'',category:'',descriptionAr:'',descriptionEn:'',published:true};if(key==='PUBLIC_TESTIMONIALS')return{id,name:'',role:'',quote:'',sourceUrl:'',published:true};return{id,hidden:false}}
function render(){const nav=$('nav'),ed=$('editor');nav.replaceChildren();for(const [key,title] of tabs)nav.append(btn(title,()=>{active=key;render()},active===key?'active':''));ed.replaceChildren();const [,title,mode]=tabs.find(t=>t[0]===active),value=data[active];ed.append(elt('h2',title));
if(mode==='list'&&Array.isArray(value)){const controls=elt('div',null,'actions'),filter=document.createElement('input');filter.placeholder='ابحث في هذا القسم';if(active!=='PUBLIC_PF_LAYOUT')controls.append(btn('+ إضافة عنصر',()=>{value.unshift(defaultRecord(active));mark();render();ed.querySelector('details')?.setAttribute('open','')},'primary'));ed.append(controls,filter);const list=elt('div');ed.append(list);function show(){list.replaceChildren();const query=filter.value.toLowerCase();value.forEach((item,i)=>{if(!JSON.stringify(item).toLowerCase().includes(query))return;const row=elt('details',null,'record');row.append(elt('summary',(i+1)+'. '+(item.titleAr||item.clientAr||item.title||item.name||item.id||'عنصر جديد')));const fields=elt('div',null,'fields');for(const k of Object.keys(item))makeField(item,k,fields,mark);row.append(fields);const actions=elt('div',null,'actions');actions.append(btn('تحريك لأعلى',()=>{if(i>0){[value[i-1],value[i]]=[value[i],value[i-1]];mark();show()}}),btn('تحريك لأسفل',()=>{if(i<value.length-1){[value[i+1],value[i]]=[value[i],value[i+1]];mark();show()}}));if(active!=='PUBLIC_PF_LAYOUT')actions.append(btn('حذف',()=>{if(confirm('حذف هذا العنصر من النسخة القادمة؟')){value.splice(i,1);mark();show()}},'danger'));row.append(actions);list.append(row)});if(!list.children.length)list.append(elt('p','لا توجد عناصر مطابقة.','muted'))}filter.oninput=show;show()}
else if(mode==='object'&&value&&typeof value==='object'&&!Array.isArray(value)){const fields=elt('div',null,'fields');for(const k of Object.keys(value))makeField(value,k,fields,mark);ed.append(fields)}
else{ed.append(elt('p','تعديل متقدم للبيانات. حافظ على بنية JSON.','muted'));const input=document.createElement('textarea');input.dir='ltr';input.style.minHeight='420px';input.value=JSON.stringify(value,null,2);ed.append(input,btn('حفظ البيانات في المسودة',()=>{try{data[active]=JSON.parse(input.value);mark();status('تم تحديث المسودة')}catch(e){status('JSON غير صالح: '+e.message,true)}},'primary'))}}
$('reload').onclick=async()=>{if(changed&&!confirm('إلغاء المسودة وإعادة تحميل النسخة المنشورة؟'))return;setBusy(true);try{await load();status('تم تحميل آخر نسخة')}catch(e){status(e.message,true)}finally{setBusy(false)}};
function closePreview(){const d=$('previewDialog');if(d.open)d.close();$('frame').removeAttribute('srcdoc');if(previewURL)URL.revokeObjectURL(previewURL);previewURL=''}
$('closePreview').onclick=closePreview;
$('preview').onclick=()=>{try{let html=build();html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+publicBase+'">');for(const [path,bytes] of pending){const type=path.endsWith('.jpg')?'jpeg':path.split('.').pop();html=html.split(publicBase+path).join('data:image/'+type+';base64,'+bytes).split(path).join('data:image/'+type+';base64,'+bytes)}$('frame').srcdoc=html;$('previewDialog').showModal()}catch(e){status(e.message,true)}};
$('backup').onclick=()=>{try{const a=elt('a');const url=URL.createObjectURL(new Blob([build()],{type:'text/html;charset=utf-8'}));a.href=url;a.download='portfolio-public-backup.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){status(e.message,true)}};
$('publish').onclick=async()=>{if(busy)return;if(!changed){status('لا توجد تعديلات جديدة');return}if(!confirm('نشر المسودة على الموقع العام؟'))return;setBusy(true);try{const html=build();const current=await call('/repos/'+repo+'/contents/index.html?ref='+branch);if(current.sha!==sha)throw Error('تم تعديل الموقع من جلسة أخرى. نزّل نسخة احتياطية وافتح آخر نسخة قبل إعادة تطبيق التعديلات.');const used=[...pending].filter(([path])=>html.includes(path));let count=0;for(const [path,bytes] of used){status('رفع الصور '+(++count)+' / '+used.length);await call('/repos/'+repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',body:JSON.stringify({message:'Upload portfolio media',content:bytes,branch})});pending.delete(path)}status('جارٍ نشر الموقع…');const r=await call('/repos/'+repo+'/contents/index.html',{method:'PUT',body:JSON.stringify({message:'Update portfolio via admin',content:encode64(html),sha,branch})});source=html;sha=r.content.sha;pending.clear();clean();status('تم حفظ التعديلات على GitHub بنجاح. تظهر على الموقع بعد اكتمال نشر GitHub Pages.')}catch(e){status('تعذر النشر: '+e.message,true)}finally{setBusy(false)}};
window.addEventListener('beforeunload',e=>{if(changed){e.preventDefault();e.returnValue=''}});
</script></body></html>
