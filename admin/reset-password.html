<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' https://vbtnshafykocfootqvaz.supabase.co; base-uri 'none'; form-action 'none'"><title>استعادة كلمة المرور</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#10101b;color:#f5f3ff;font:16px/1.7 system-ui,Tahoma,Arial,sans-serif}main{width:min(100%,480px);background:#171c30;border:1px solid #34384f;border-radius:20px;padding:26px}h1{font-size:24px;margin:0 0 8px}p{color:#c1c2d5}label{display:block;margin:14px 0 5px}input,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid #494e68}input{background:#101221;color:white}button{margin-top:18px;background:#a8baff;color:#11182d;border:none;font-weight:700;cursor:pointer}button:disabled{opacity:.55}a{color:#a8baff}#status{min-height:2em;overflow-wrap:anywhere;color:#d8e0ff}[hidden]{display:none!important}</style></head><body><main><h1>استعادة كلمة المرور</h1><section id="request" hidden><p>اكتب البريد الإلكتروني الخاص بحساب الإدارة، وسنرسل إليه رابطًا لتعيين كلمة مرور جديدة.</p><form id="requestForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" dir="ltr" autocomplete="email" required><button id="send">إرسال رابط الاستعادة</button></form></section><section id="change" hidden><p>اختر كلمة مرور جديدة قوية خاصة بيك.</p><form id="changeForm"><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" minlength="14" maxlength="128" autocomplete="new-password" required><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" minlength="14" maxlength="128" autocomplete="new-password" required><button id="save">حفظ كلمة المرور الجديدة</button></form></section><p id="status" role="status" aria-live="polite"></p><a href="./">الرجوع إلى لوحة الإدارة</a></main><script>
'use strict';
const $=x=>document.getElementById(x),status=x=>$('status').textContent=x;
const fragment=new URLSearchParams(location.hash.slice(1));let token=fragment.get('type')==='recovery'?fragment.get('access_token')||'':'';
const redirect=location.origin+'/Abdelrhman-hamoud/admin/reset-password.html';
const linkError=!!(fragment.get('error')||new URLSearchParams(location.search).get('error'));
history.replaceState(null,'',location.pathname);
let config;
async function settings(){if(config)return config;const r=await fetch('./auth-config.json',{cache:'no-store'});if(!r.ok)throw Error('إعدادات الاستعادة غير متاحة.');config=await r.json();if(config.url!=='https://vbtnshafykocfootqvaz.supabase.co'||!config.publishableKey)throw Error('إعدادات غير صالحة.');return config}
async function api(path,method,body,authenticated=false){const c=await settings();const r=await fetch(c.url+path,{method,headers:{apikey:c.publishableKey,'Content-Type':'application/json',...(authenticated?{Authorization:'Bearer '+token}:{})},...(body===undefined?{}:{body:JSON.stringify(body)}),cache:'no-store'});let data;try{data=await r.json()}catch{data=null}return {ok:r.ok,status:r.status,data}}
async function allowed(){const r=await api('/rest/v1/rpc/is_portfolio_admin','POST',{},true);return r.ok&&r.data===true}
(async()=>{if(token){try{if(await allowed()){$('change').hidden=false;return}}catch{}token='';status('الرابط غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا.')}else if(linkError)status('الرابط غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا.');$('request').hidden=false})();
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();$('send').disabled=true;status('جارٍ إرسال رابط الاستعادة…');try{const r=await api('/auth/v1/recover?redirect_to='+encodeURIComponent(redirect),'POST',{email:$('email').value.trim()});if(!r.ok){status(r.status===429?'تم تجاوز حد الإرسال. حاول لاحقًا.':'تعذّر إرسال رسالة الاستعادة. راجع إعدادات البريد في Supabase.');return}status('لو البريد مسجل ومسموح له باستقبال الرسائل، هيوصلك رابط الاستعادة. راجع البريد الوارد والرسائل غير المرغوب فيها.')}catch{status('تعذر الاتصال بخدمة الاستعادة.')}finally{$('send').disabled=false}});
$('changeForm').addEventListener('submit',async e=>{e.preventDefault();const p=$('password').value;if(p!==$('confirm').value){status('كلمتا المرور غير متطابقتين.');return}if(p.length<14||p.length>128){status('استخدم كلمة مرور من 14 إلى 128 حرفًا.');return}$('save').disabled=true;status('جارٍ حفظ كلمة المرور…');try{if(!token||!await allowed()){status('انتهت صلاحية الرابط. اطلب رابطًا جديدًا.');return}const r=await api('/auth/v1/user','PUT',{password:p},true);if(!r.ok){status('لم يتم تغيير كلمة المرور. اختر كلمة جديدة أو اطلب رابط استعادة آخر.');return}try{await api('/auth/v1/logout?scope=global','POST',undefined,true)}catch{}token='';$('changeForm').reset();$('change').hidden=true;status('تم تغيير كلمة المرور بنجاح. ارجع للوحة الإدارة وسجل الدخول بالكلمة الجديدة.')}catch{status('تعذر حفظ كلمة المرور.')}finally{$('save').disabled=false}});
</script></body></html>
