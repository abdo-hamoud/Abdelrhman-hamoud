<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://vbtnshafykocfootqvaz.supabase.co; form-action 'none'; base-uri 'none'"><title>تفعيل حساب الإدارة</title><style>
*{box-sizing:border-box}body{margin:0;background:#10101b;color:#f5f3ff;font:16px/1.7 system-ui,Tahoma,Arial;display:grid;min-height:100vh;place-items:center;padding:24px}main{width:min(100%,470px);background:#191c30;border:1px solid #34384f;border-radius:22px;padding:28px}h1{font-size:24px;margin:0}p{color:#c1c2d5}label{display:block;margin:12px 0 5px}input,button{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid #494e68}input{background:#101221;color:#fff}button{margin-top:20px;background:#a8baff;color:#13172b;border:none;cursor:pointer;font-weight:700}button:disabled{opacity:.5}a{color:#a8baff}#status{overflow-wrap:anywhere;min-height:2em}</style></head><body><main><h1>تفعيل حساب الإدارة</h1><p>خطوة واحدة فقط لإنشاء حسابك الخاص. استخدم بريدًا حقيقيًا تملكه حتى تتمكن من استعادة الحساب.</p><form id="form"><label for="code">كود التفعيل (مرة واحدة)</label><input id="code" type="password" autocomplete="off" required dir="ltr"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username" dir="ltr"><label for="password">كلمة المرور الجديدة (14 حرفًا على الأقل)</label><input id="password" type="password" required minlength="14" maxlength="128" autocomplete="new-password" dir="ltr"><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" required minlength="14" maxlength="128" autocomplete="new-password" dir="ltr"><button id="submit">تفعيل الحساب</button></form><p id="status" role="status" aria-live="polite"></p><a href="./" id="admin">الدخول إلى لوحة الإدارة</a></main><script>
const $=s=>document.getElementById(s);
const url='https://vbtnshafykocfootqvaz.supabase.co/functions/v1/portfolio-activate';
const messages={'Invalid activation code':'كود التفعيل غير صحيح.','Activation already used or expired':'الكود انتهت صلاحيته أو تم استخدامه بالفعل.','Invalid setup details':'راجع البريد الإلكتروني وكلمة المرور والكود.','Account creation failed. Contact administrator before retrying.':'تعذر إنشاء الحساب؛ اطلب مراجعة الإعداد قبل إعادة المحاولة.','Account created but access needs administrator review':'تم إنشاء الحساب لكن الصلاحيات بحاجة إلى مراجعة.','Activation unavailable':'خدمة التفعيل غير متاحة.','Activation incomplete':'التفعيل غير مكتمل.'};
$('form').addEventListener('submit',async e=>{e.preventDefault();if($('password').value!==$('confirm').value){$('status').textContent='كلمتا المرور غير متطابقتين.';return}$('submit').disabled=true;$('status').textContent='جارٍ التفعيل…';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',apikey:'sb_publishable_6NrjWh41zcaG1FZIZ-5feg_dFBEa49G'},body:JSON.stringify({code:$('code').value.trim(),email:$('email').value.trim(),password:$('password').value})});const data=await r.json();if(!r.ok||!data.ok)throw Error(messages[data.error]||'تعذر التفعيل.');$('form').reset();$('form').hidden=true;$('status').textContent='تم تفعيل حساب الإدارة. اضغط على رابط الدخول أدناه.';}catch(e){$('status').textContent=e.message;$('password').value='';$('confirm').value='';}finally{$('submit').disabled=false}});
</script></body></html>
